name: Persistence

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: persistence-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: chat_apps

jobs:  
  test-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rust_ai_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rust_ai_chat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ANALYTICS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rust_ai_chat_test
      ANALYTICS_CHAT_TOKEN: local-ci-chat-token
      ANALYTICS_PET_TOKEN: local-ci-pet-token
      CHAT_DATABASE_URL: "sqlite::memory:"
      PET_DATABASE_URL: "sqlite::memory:"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version "^0.9" --no-default-features --features postgres,sqlite --locked

      - name: Test persistence
        run: DATABASE_URL="$CHAT_DATABASE_URL" cargo test --locked -p chat-persistence
        working-directory: chat_apps

      - name: Test Pet Persistence
        run: DATABASE_URL="$PET_DATABASE_URL" cargo test --locked -p pet-persistence
        working-directory: pet_apps

      - name: Test analytics server with PostgreSQL
        run: DATABASE_URL="$ANALYTICS_DATABASE_URL" cargo test --locked -p analytics-persistence --features postgres-integration
        working-directory: analytics_apps
