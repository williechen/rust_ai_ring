name: Rust Desktop Pet

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: desktop_pet-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: pet_apps

jobs:
  check-pet:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Check native dependencies
        run: |
          echo "GLib:"
          pkg-config --modversion glib-2.0

          echo "GTK:"
          pkg-config --modversion gtk+-3.0

          echo "libsoup:"
          pkg-config --modversion libsoup-3.0

          echo "JavaScriptCore:"
          pkg-config --modversion javascriptcoregtk-4.1

          echo "WebKitGTK:"
          pkg-config --modversion webkit2gtk-4.1

      - name: Install trunk
        run: cargo install trunk --version 0.22.0 --locked

      - name: Check native workspace
        run: cargo check --locked --workspace --exclude pet-ui

      - name: Check desktop frontend
        run: cargo check --locked -p pet-ui --target wasm32-unknown-unknown

  build-pet:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install trunk
        run: cargo install trunk --version 0.22.0 --locked

      - name: Build desktop
        working-directory: pet_apps/pet_ui
        run: trunk build --locked --release

      - name: Build native desktop
        run: cargo build --locked --release --workspace --exclude pet-ui

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pet-linux
          if-no-files-found: error
          path: |
            pet_apps/target/release/pet-server
            pet_apps/pet_ui/dist
