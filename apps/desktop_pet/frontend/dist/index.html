  <title>Rust AI Desktop Pet</title>

  <link rel="stylesheet" href="/style-d57d0a09985bbf11.css" integrity="sha384-NwfmlFssYwETfvBv9xVjzdE8742RYp8GsZVZR9ux6oAKJWa/v1OMsCR8ZJNH6EUG"/>
<link rel="modulepreload" href="/desktop-pet-frontend-7b841a7a5c703a3b.js" crossorigin="anonymous" integrity="sha384-/j4Mtfa7sCvFjYVDQkQEy0/app5Ak8y0WxJZzXn+yXl4TOT5HQOH7iAnGK6W6BzZ"><link rel="preload" href="/desktop-pet-frontend-7b841a7a5c703a3b_bg.wasm" crossorigin="anonymous" integrity="sha384-ol8wj6W/I/BID/Ijqb2fN2aikeRQFEXVhdbpOsXCq84cqyKPSmENpOgEIKJE83Z1" as="fetch" type="application/wasm"></head>

<body>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const windowPetId = new URLSearchParams(location.search).get("pet_id");

    const currentPetId = async () => {
      const id = windowPetId || (await invoke("active_pet"))?.id;
      if (!id) throw "請先選擇並出籠寵物";
      return id;
     };

    window.getPetState = async () => invoke("get_saved_pet_state", { id: await currentPetId() });
    
    window.sendPetCommand = async (command) => invoke("send_saved_pet_command", { id: await currentPetId(), command });
    
    window.listenPetState = (callback) => listen("saved-pet-state", async (event) => {
      try { if (event.payload.id === await currentPetId()) callback(event.payload.snapshot); } catch (_) {}
    });
    
    window.openSavedPet = (id) => invoke("open_saved_pet", { id });
    
    window.cageSavedPet = async () => invoke("cage_saved_pet", { id: await currentPetId() });

    window.chatWithPet = (message) => {
      return invoke("chat_with_pet", { message });
    };

    window.isPetWindow = () => {
      return new URLSearchParams(window.location.search).get("view") === "pet";
    };

    window.openPetControls = () => {
      return invoke("open_control_window");
    };

    window.quitPet = () => {
      return invoke("quit_pet");
    };

    let petContextMenu = null;

    async function getPetContextMenu() {
      if (petContextMenu) {
        return petContextMenu;
      }

      const { Menu } = window.__TAURI__.menu;

      petContextMenu = await Menu.new({
        items: [
          {
            id: `pet:${await currentPetId()}:interact`,
            text: "互動",
          },
          {
            id: `pet:${await currentPetId()}:sleep`,
            text: "睡覺",
          },
          {
            id: `pet:${await currentPetId()}:wake`,
            text: "醒來",
          },
        ],
      });

      return petContextMenu;
    }

    window.showPetContextMenu = async (x, y) => {
      const menu = await getPetContextMenu();

      const {
        getCurrentWindow,
      } = window.__TAURI__.window;

      const {
        LogicalPosition,
      } = window.__TAURI__.dpi;

      const appWindow = getCurrentWindow();

      await menu.popup(
        new LogicalPosition(x, y),
        appWindow,
      );
    };

    window.scanFilePreview = async () => {
      return invoke("scan_file_preview");
    };

    window.scanDuplicatePreview = () => {
      return invoke("scan_duplicate_preview");
    };

    window.activePet = () => windowPetId ? invoke("saved_pet_profile", { id: windowPetId }) : invoke("active_pet");

    window.selectPet = (id) => invoke("select_pet", { id });
    
    window.listenPetProfile = (callback) => window.__TAURI__.event.listen(
      "pet-profile-changed", (event) => { if (!windowPetId || event.payload.id === windowPetId) callback(event.payload); });


    window.listPets = () => {
      return invoke("list_pets");
    };

    window.createPet = (name) => {
      return invoke("create_pet", { name });
    };

  </script>

  
<script type="module">
import init, * as bindings from '/desktop-pet-frontend-7b841a7a5c703a3b.js';
const wasm = await init({ module_or_path: '/desktop-pet-frontend-7b841a7a5c703a3b_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
<script>"use strict";

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';
    const base = '{{__TRUNK_WS_BASE__}}';
    let protocol = 'ws';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
            this._title.prepend(icon);

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();
                },
                this.poll_interval);
        }

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();
            }
            this._overlay.reason = reason;
        }
    }

    new Client(url).start();

})()
</script></body>
</html>
